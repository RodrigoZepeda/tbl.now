# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
    paths-ignore: &not_covered
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - 'README.md'
      - 'README.Rmd'
      - 'SKILL.md'
      - 'DEVELOPMENT_SKILL.md'
      - 'BATCH_DETECTION_EXPLAINED.md'
      - 'NEWS.md'
      - 'cran-comments.md'
      - '*.Rproj'
      - 'Dockerfile'
      - 'codecov.yml'
      - '.covrignore'
      - '.gitignore'
      - 'devel/**'
      - 'data-raw/**'
      - 'paper/**'
      - 'presentations/**'
      - 'inst/figures/**'
      # coverage never exercises vignettes (real or pkgdown articles)
      - 'vignettes/**'
  pull_request:
    paths-ignore: *not_covered

name: test-coverage.yaml

permissions: read-all

concurrency:
  group: test-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # Neither epidist/epinowcast (nor their dep primarycensored) nor
          # almanac are on CRAN; almanac was archived, so it comes from the
          # author's r-universe.
          extra-repositories: |
            https://epinowcast.r-universe.dev
            https://davisvaughan.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
