# Build the articles, and fail the PR if one of them is broken.
#
# Nothing else covers this. `R CMD check` builds `vignettes/*.Rmd` but NEVER
# `vignettes/articles/*.Rmd`, so an article that errors passes a green
# R-CMD-check run in silence. `pkgdown.yaml` does build them, but as part of the
# whole site -- reference pages, every example, the lot -- so a broken article
# surfaces late, behind work that has nothing to do with it, in a job whose
# failure reads as "the website is unhappy".
#
# This job builds the articles and nothing else, so the feedback is fast and the
# check name says what actually broke.
on:
  push:
    branches: [main, master]
    paths: &articles
      - 'R/**'
      - 'vignettes/**'
      - 'inst/fragments/**'
      - 'data/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '_pkgdown.yml'
      - '.github/workflows/articles.yaml'
  pull_request:
    paths: *articles
  workflow_dispatch:

name: articles.yaml

permissions: read-all

jobs:
  articles:
    runs-on: ubuntu-latest
    concurrency:
      group: articles-${{ github.event_name != 'pull_request' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # Same set as pkgdown.yaml: neither epidist/epinowcast (nor their dep
          # primarycensored) nor almanac are on CRAN.
          extra-repositories: |
            https://epinowcast.r-universe.dev
            https://davisvaughan.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # Cheap, and it catches the failure that survives a green build: a link to
      # an article that was renamed or removed. Runs first so a dead link is
      # reported in seconds rather than after every article has been knitted.
      - name: Check article cross-references
        run: Rscript devel/check_article_links.R

      - name: Build articles
        run: |
          pkgdown::init_site()
          pkgdown::build_articles()
        shell: Rscript {0}

      # An article can FAIL WITHOUT FAILING: a chunk marked `error = TRUE`
      # renders its error into the page instead of stopping the build, and one
      # left on by accident turns a broken article into a green run. The
      # articles use that deliberately (`validate_tbl_now()` is demonstrated by
      # letting it abort), so the source is what gets checked -- a per-chunk
      # `error = TRUE` is allowed, a global one in `opts_chunk$set()` is not.
      - name: Refuse a global `error = TRUE`
        run: |
          offenders <- Filter(
            function(path) {
              text <- paste(readLines(path, warn = FALSE), collapse = "\n")
              setup <- regmatches(
                text, regexpr("opts_chunk\\$set\\((?:[^()]|\\([^()]*\\))*\\)", text)
              )
              length(setup) > 0 && grepl("error\\s*=\\s*TRUE", setup)
            },
            list.files("vignettes", pattern = "[.]Rmd$", recursive = TRUE,
                       full.names = TRUE)
          )
          if (length(offenders) > 0) {
            stop("Global `error = TRUE` in: ", paste(offenders, collapse = ", "),
                 ". Set it on the one chunk that needs it instead.")
          }
          cat("OK: no article silences errors globally.\n")
        shell: Rscript {0}

      # So a reviewer can read the rendered article from the PR rather than
      # trusting a green tick.
      - name: Upload rendered articles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles
          path: docs/articles
          retention-days: 14
          if-no-files-found: warn
