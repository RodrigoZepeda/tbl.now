name: Build and Release Package

on:
  workflow_run:
    workflows: ["R-CMD-check.yaml"]
    types:
      - completed

jobs:
  build-and-release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' 

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          # almanac was archived from CRAN; it comes from the author's r-universe.
          extra-repositories: |
            https://epinowcast.r-universe.dev
            https://davisvaughan.r-universe.dev

      - name: Setup pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::pkgdown

      - name: Extract version from DESCRIPTION
        id: version
        run: |
          VERSION=$(grep "^Version:" DESCRIPTION | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PKG_FILE=tbl.now_${VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Build package bundle
        run: |
          R CMD build .
        shell: bash

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: tbl.now v${{ env.VERSION }}
          artifacts: "${{ env.PKG_FILE }}"
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
