# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
    paths-ignore: &not_package
      - 'pkgdown/**'
      - '_pkgdown.yml'
      - 'README.md'
      - 'README.Rmd'
      - 'SKILL.md'
      - 'DEVELOPMENT_SKILL.md'
      - 'BATCH_DETECTION_EXPLAINED.md'
      - 'NEWS.md'
      - 'cran-comments.md'
      - '*.Rproj'
      - 'Dockerfile'
      - 'codecov.yml'
      - '.covrignore'
      - '.gitignore'
      - 'devel/**'
      - 'data-raw/**'
      - 'paper/**'
      - 'presentations/**'
      - 'vignettes/articles/**'
      - 'inst/figures/**'
  pull_request:
    paths-ignore: *not_package
  schedule:
    - cron: '13 4 * * 1'   # Mondays 04:13 UTC - full matrix regression run
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

concurrency:
  group: R-CMD-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide how wide the check matrix needs to be for this event:
  #   * schedule / workflow_dispatch -> full cross-platform matrix
  #   * pull_request touching compiled/tested code -> full matrix
  #   * everything else (push to main, vignette/doc-only PR) -> Linux release only
  matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.decide.outputs.config }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          full='[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"}]'
          linux='[{"os":"ubuntu-latest","r":"release"}]'
          config="$linux"
          case "$EVENT" in
            schedule|workflow_dispatch)
              config="$full" ;;
            pull_request)
              if changed="$(git diff --name-only "$BASE...$HEAD")"; then
                echo "changed files:"; echo "$changed"
                if printf '%s\n' "$changed" | grep -qE '^(R/|src/|tests/|inst/|data/|DESCRIPTION|NAMESPACE|\.github/workflows/R-CMD-check\.yaml)'; then
                  config="$full"
                fi
              else
                echo "git diff failed; running the full matrix to be safe"
                config="$full"
              fi ;;
          esac
          echo "config=$config" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: matrix
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.matrix.outputs.config) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:

      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # Neither epidist/epinowcast (nor their dep primarycensored) nor
          # almanac are on CRAN; almanac was archived, so it comes from the
          # author's r-universe.
          extra-repositories: |
            https://epinowcast.r-universe.dev
            https://davisvaughan.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
