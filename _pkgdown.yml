url: https://rodrigozepeda.github.io/tbl.now/

home:
  title: tbl.now — Tibble now
  description: >
    Extension of the tibble class for storing, validating, and manipulating
    epidemiological nowcasting data.

template:
  bootstrap: 5
  # pkgdown >= 2.1 renders a light/dark toggle in the navbar and sets
  # `data-bs-theme` on <html>. Every colour in `pkgdown/extra.css` is a
  # `var(--tn-*)` token defined for both modes, so the switch themes the whole
  # site rather than only the parts Bootstrap knows about.
  light-switch: true
  # NOTE: `pkgdown/extra.css` is picked up and linked automatically by pkgdown.
  # It must NOT be listed under `includes: in_header:` — that slot expects HTML
  # and would paste raw CSS text into <head>, where the browser ignores it.
  math-rendering: katex
  bslib:
    bootswatch: flatly
    primary: "#5F7E62"      # dark sage green
    secondary: "#A8BFA9"    # light sage
    success: "#5F7E62"
    danger: "#B85348"       # desaturated red
    dark: "#262626"         # charcoal


navbar:
  structure:
    # `lightswitch` MUST be listed here. `template: light-switch: true` only
    # loads `lightswitch.js`; the control itself is a navbar *component*, and
    # pkgdown's default right-hand structure is `[search, github, lightswitch]`.
    # Naming an explicit `right:` REPLACES that default, so omitting the
    # component silently drops the toggle -- the script loads, the site has no
    # button, and nothing errors.
    left:  [get_started, reference, articles, news]
    right: [search, github, twitter, lightswitch]

  components:
    get_started:
      text: Get started
      href: articles/tbl.now.html
    twitter:
      icon: fab fa-twitter
      href: https://twitter.com/rodzepeda
      aria-label: Twitter
    github:
      icon: fab fa-github
      href: https://github.com/rodrigozepeda/tbl.now
      aria-label: GitHub

# Every exported topic must appear below or `pkgdown` fails the build. When you
# export something new, add it here in the same commit.
